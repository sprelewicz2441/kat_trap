<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kat Trap</title>
  <!-- Google Analytics (GA4) — visitor stats, including a Realtime
       location map (Reports > Realtime in analytics.google.com). Loaded
       early per Google's own recommendation, but async so it can't block
       main.js's own async load below or delay first paint. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-29C0CKEGRN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-29C0CKEGRN');
  </script>
  <!-- iOS Safari/Chrome never expose the Fullscreen API on iPhone (only
       iPadOS does) — requestFullscreen() is a silent no-op there regardless
       of which browser or when it's called (see SetupScreen.js). This is
       iPhone's real fix: launched from a home-screen icon (Share > Add to
       Home Screen), apple-mobile-web-app-capable hides Safari/Chrome's
       address bar and toolbar entirely, unlike anything script can force
       from inside a normal browser tab. Only takes effect for that
       home-screen-launched copy — visiting the URL directly in the browser
       is unaffected and still shows normal browser chrome. -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kat Trap">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fb8c00">
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- styles.css never had the project's own JS-module ?v= cache-busting
       convention (see CLAUDE.md's Module-level cache-busting) since it's a
       plain <link>, not an import - a real gap, caught live when a CSS-only
       fix (the credits modal's cat-ear shape) didn't visibly change after
       editing the file, matching the exact "stale cached copy" symptom that
       convention exists to prevent elsewhere. Bump this on every future
       edit to styles.css. -->
  <link rel="stylesheet" href="./styles.css?v=23">
  <!-- `async` (not a bare module, which behaves like `defer`) is load-
       bearing here: any non-async script — module or not — waits for every
       preceding stylesheet in the document to finish loading before it's
       allowed to execute, per spec, regardless of whether the stylesheet
       actually affects anything the script touches. Tailwind's CDN build
       above is ~2.9MB uncompressed (confirmed by fetching it directly) —
       on a slow mobile connection that's enough to stall main.js for a
       second or more, during which the canvas sat there as a plain white
       box (see the bg-white removal below). Confirmed empirically with a
       throwaway test page (an artificially slow stylesheet + inline module
       script) that a plain module script really does block on it for the
       stylesheet's full load time, and that `async` skips the wait
       entirely. main.js's own init() is guarded against running before the
       DOM is ready (see main.js) since async, unlike defer, doesn't wait
       for the document to finish parsing either. -->
  <script type="module" src="./js/main.js" async></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">
  <!-- Game Canvas. justify-center (not justify-start) is load-bearing: on
       viewport aspect ratios closer to square than 4:3, the canvas is
       width- rather than height-constrained (see resizeCanvas() in
       js/main.js) and ends up shorter than the viewport, leaving empty
       space below it — justify-start dumped all of that space below the
       canvas instead of splitting it top/bottom, which looked broken
       (confirmed live) and also threw off the touch controls' vertical
       centering (they center on viewport-middle, which only lines up with
       the canvas's own middle once the canvas itself is centered). The
       retro handheld-console frame lives around the whole viewport instead
       (see styles.css, body::before/::after) — not here. -->
  <main class="relative inline-flex items-center justify-center">
    <!-- No bg-white here (previously had one): the canvas is transparent
         until the first frame paints, so it now just shows body's dark
         bg-gray-900 through it in that gap instead of a stark white box —
         the actual visible symptom of the white-flash bug, independent of
         how long that gap ends up being (see the script tag's async note
         above for the bigger fix to the gap's length itself). -->
    <canvas id="gameCanvas"></canvas>

    <!-- Settings (hamburger) menu — visible on ALL devices during gameplay
         (unlike the touch-only controls below, sound isn't touch-specific).
         Lives here, as a DOM child of the same shrink-wrapped `<main>` the
         canvas sits in (`relative inline-flex` above — sized to exactly
         match the canvas, not the full viewport width), specifically so its
         desktop position (`position: absolute` in styles.css, anchored to
         `main`'s own edges) tracks wherever the board actually ends up
         through the browser's own layout engine — no JS measurement of the
         canvas's position involved at all. Two earlier JS-measured
         approaches (gutter-centering, then a resize-listener computing
         `canvas.getBoundingClientRect()`) were each flagged live as still
         overlapping the board in some environment this project couldn't
         fully reproduce or diagnose — this sidesteps needing to. Being a
         DOM descendant of `main` doesn't change anything for the *touch*
         case (`position: fixed` in the `pointer: coarse` media query),
         since `position: fixed` is viewport-relative regardless of
         ancestor nesting unless an ancestor establishes a new containing
         block (a transform/filter/perspective, none of which `main` has)
         — touch positioning (`js/utils/touchControls.js`) is unaffected.
         See js/utils/audio.js for the two independent mute flags: music
         starts muted, sounds (SFX) start unmuted. -->
    <div id="settingsMenu">
      <button id="settingsToggle" aria-label="Settings" aria-expanded="false">&#9776;</button>
      <div id="settingsPanel" hidden>
        <button id="musicToggleBtn" aria-pressed="false"></button>
        <button id="sfxToggleBtn" aria-pressed="true"></button>
        <button id="creditsBtn">&#128156; Credits</button>
      </div>
    </div>
  </main>

  <!-- Landscape-only gate (mobile milestone — see CLAUDE.md Mobile responsiveness) -->
  <div id="orientationGate">
    <div class="rotate-icon">🔄</div>
    <p class="text-xl font-bold">Rotate your device to landscape to play.</p>
  </div>

  <!-- iOS "Add to Home Screen" hint — see js/utils/homeScreenHint.js. Only
       shown for iOS Safari specifically (not iPad, not already standalone,
       not Chrome/Firefox/etc. on iOS), since that's the one platform/
       browser combination where adding to the home screen actually
       unlocks a real fullscreen-ish experience (see CLAUDE.md's
       Fullscreen support entry). Hidden automatically once gameplay
       starts (body.in-game, see styles.css) so it never covers the board;
       shown pre-game (setup/character-select) instead. -->
  <div id="homeScreenHint" hidden>
    <span id="homeScreenHintIcon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/>
        <path d="M7 8l5-5 5 5"/>
        <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>
      </svg>
    </span>
    <p>Tap <strong>Share</strong>, then <strong>Add to Home Screen</strong> to put the icon on the Home Screen and play from there in fullscreen.</p>
    <button id="homeScreenHintClose" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Credits modal — a small "who made this" card, separate from the
       settingsPanel dropdown above (that one's utilitarian; this one gets
       the same cute cream-card treatment as the cutscene/game-over modals
       drawn on canvas elsewhere, just in DOM form since it's launched from
       DOM chrome). See js/utils/settingsMenu.js for open/close wiring. -->
  <div id="creditsModal" hidden>
    <div id="creditsCard" role="dialog" aria-modal="true" aria-labelledby="creditsHeading">
      <div class="credits-ear credits-ear-left"></div>
      <div class="credits-ear credits-ear-right"></div>
      <button id="creditsCloseBtn" aria-label="Close credits">&times;</button>
      <p class="credits-eyebrow">Created by, Imagineered by &amp; Produced by</p>
      <h2 id="creditsHeading" class="credits-name">Kathryn Hodges</h2>
      <p class="credits-subline">Engineered by Daddy <span class="credits-dad-name">(Scott Prelewicz)</span></p>
      <div class="credits-paws">&#128062;&#128062;&#128062;</div>
    </div>
  </div>

  <!-- Login modal (see js/utils/loginModal.js) — opened from SetupScreen's
       canvas-drawn "Login" button. A real DOM form since canvas can't take
       text input, same reasoning as the touch d-pad dispatching real
       KeyboardEvents rather than trying to fake input on canvas. Styled
       close to #creditsModal's cream-card language (this is still a
       pre-game moment, not utility chrome) but without the cat-ear cutouts
       — this card holds real form controls, not just text. -->
  <div id="loginModal" hidden>
    <div id="loginCard" role="dialog" aria-modal="true" aria-labelledby="loginHeading">
      <button id="loginCloseBtn" aria-label="Close login" type="button">&times;</button>
      <h2 id="loginHeading">Login</h2>
      <form id="loginForm">
        <label for="loginUsername">Username</label>
        <input id="loginUsername" name="username" type="text" autocomplete="username" required>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        <p id="loginError" hidden></p>
        <button id="loginSubmitBtn" type="submit">Log In</button>
      </form>
    </div>
  </div>

  <!-- Store modal (see js/utils/storeModal.js) — opened from GameScreen's
       canvas-drawn "Store" button. A real DOM modal rather than canvas-drawn
       cards, same reasoning as the login modal: dynamic owned/locked/
       affordable states are much simpler as DOM than as hand-rolled canvas
       hit-testing per row.

       Two separate storefronts sharing one modal shell, switched via
       #storeTabBloomingtails/#storeTabPawgreens (js/utils/storeModal.js's
       switchTab()) - split per explicit direction ("remove the non-clothes
       items from this store, we will create a new store for those things
       called Pawgreens") since cosmetics and perks are different enough
       shopping experiences (trying on a look vs. buying an upgrade) to
       deserve their own presentation rather than being crammed into one
       generic list. Both panels read from the same single getStore() fetch
       (js/utils/storeModal.js's currentState) - no separate network call
       per store, just filtered client-side by item_type.

       #bloomingtailsPanel is the "dressing room" - a real fitting-room
       scene with a pedestal (a bride trying on dresses, not a department-
       store rack). Per explicit direction ("make the dressing room bigger,
       if not the full background... like you may see in a console game"),
       #storePedestalScene's backdrop now fills the *entire* card edge-to-
       edge (see styles.css's #storeCard padding:0) with every other
       element - heading/wallet-line/arrows/name/button - positioned as
       overlaid UI directly on top of it, gradient scrims behind the text
       for legibility against a busy photo, rather than the photo being one
       inset box among several stacked elements. Outfits are browsed right
       on the pedestal via #storePrevOutfitBtn/#storeNextOutfitBtn, no
       separate list - "scroll through and try one on" is specifically an
       outfit gesture.

       #pawgreensPanel is a plain shopping list, deliberately not another
       pedestal - perks are invisible gameplay effects, not something to
       try on, so a list of upgrades (name, description, cost/status, buy
       button) fits the metaphor better. #pawgreensBackdrop is a simple
       placeholder for now (matching Bloomingtails' own pre-real-art
       history) - eventual real art is meant to read like a convenience-
       store checkout counter, deferred until the split itself is solid.
       Every row gets its own inline buy button (see
       storeModal.js's buildPawgreensRow()) rather than routing through a
       single shared action button the way Bloomingtails does - there's no
       character preview to focus a single button's target on, so "which
       item does this button act on" needs to live on the row itself. -->
  <div id="storeModal" hidden>
    <div id="storeCard" role="dialog" aria-modal="true" aria-labelledby="storeHeading">
      <button id="storeCloseBtn" aria-label="Close store" type="button">&times;</button>

      <div id="storeTabs" role="tablist">
        <button id="storeTabBloomingtails" class="store-tab" type="button" role="tab" aria-selected="true"><img src="./assets/bloomingtails_logo.png" class="store-tab-logo" alt=""><span class="store-tab-label">Bloomingtails</span></button>
        <button id="storeTabPawgreens" class="store-tab" type="button" role="tab" aria-selected="false"><span class="store-tab-icon" aria-hidden="true">🐾</span><span class="store-tab-label">Pawgreens</span></button>
      </div>

      <div id="bloomingtailsPanel" class="store-panel">
        <div id="storePedestalScene">
          <div id="storeOverlayTop">
            <h2 id="storeHeading"><img src="./assets/bloomingtails_logo.png" alt="Bloomingtails"></h2>
            <p id="storeWalletLine"></p>
          </div>
          <button id="storePrevOutfitBtn" aria-label="Previous outfit" type="button">&#10094;</button>
          <canvas id="storePedestalCanvas" width="240" height="240"></canvas>
          <button id="storeNextOutfitBtn" aria-label="Next outfit" type="button">&#10095;</button>
          <div id="storeOverlayBottom">
            <p id="storePreviewName"></p>
            <button id="storePedestalActionBtn" class="store-item-buy" type="button"></button>
            <button id="storePedestalSellBtn" class="store-item-sell" type="button" hidden></button>
          </div>
        </div>
      </div>

      <div id="pawgreensPanel" class="store-panel" hidden>
        <div id="pawgreensBackdrop">
          <h2 id="pawgreensHeading">Pawgreens <span id="pawgreensHeadingMark" aria-hidden="true">🐾</span></h2>
          <p id="pawgreensWalletLine"></p>
        </div>
        <div id="pawgreensItemsList"></div>
      </div>
    </div>
  </div>

  <!-- On-screen touch controls — only visible on touch devices during
       gameplay (see styles.css). D-pad (movement) on the left, action
       buttons (punch/toot/meow — the same keys as desktop, see
       InputHandler.js) on the right; a future credits/settings/etc. icon
       row is planned for the top corners rather than competing with either
       of these. This markup ships the Cat/Mouse-mode default (all three
       visible, punchBtn showing punch) — touchControls.js's
       setActionButtonsMode() (called from GameScreen.init()) swaps
       punchBtn to a poop icon and hides toot/meow in Dog mode, where
       toot's own dog-shoving effect is already a no-op (see
       GameScreen.js's handleToot()/punchHandler). -->
  <div id="dpad">
    <button id="dpadUp" class="dpad-btn dpad-up" aria-label="Up"></button>
    <button id="dpadLeft" class="dpad-btn dpad-left" aria-label="Left"></button>
    <button id="dpadRight" class="dpad-btn dpad-right" aria-label="Right"></button>
    <button id="dpadDown" class="dpad-btn dpad-down" aria-label="Down"></button>
  </div>
  <div id="actionButtons">
    <button id="punchBtn" class="action-btn" aria-label="Punch">&#128074;</button>
    <button id="tootBtn" class="action-btn" aria-label="Toot">&#128239;</button>
    <button id="meowBtn" class="action-btn" aria-label="Meow">&#128570;</button>
  </div>
</body>
</html>
